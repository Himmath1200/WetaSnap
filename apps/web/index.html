<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#047857" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WeTa Snap" />
    <meta name="description" content="Scan business cards at exhibitions — online or offline." />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>WeTa Snap</title>
    <script>
      // Apply the saved theme before the first paint so the app never flashes white in dark mode.
      try {
        var p = localStorage.getItem('wetasnap-theme');
        if (p === 'dark' || p === 'light') document.documentElement.setAttribute('data-theme', p);
        var dark = p === 'dark' || (p !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.style.background = dark ? '#0d0f14' : '#f6faf9';
        var m = document.querySelector('meta[name="theme-color"]');
        if (m && dark) m.setAttribute('content', '#0d0f14');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
